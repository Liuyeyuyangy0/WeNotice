name: Build & Release (portable)

# 发布流程见 docs/RELEASE-PROCESS.md：
#   - 日常提交：走 ci.yml，只检查、不出包、不发版
#   - 预发布（给别人验收）：tag 形如 v1.3.5-beta.1 → 构建并创建 Pre-release（不占 Latest）
#   - 正式发布：tag 形如 v1.3.5（不带 -beta）→ 构建并创建正式 Release（Latest）
#   - 手动运行：publish=none 只构建并上传 artifact；publish=prerelease/latest 可手动发版
#
# 如果配置了 SignPath（开源免费签名），会自动给 WeNotice.exe 签名。
# 需要的仓库配置（SignPath 批准后设置，见 docs/SIGNPATH-APPLICATION.md）：
#   Variables: SIGNPATH_PROJECT_SLUG / SIGNPATH_SIGNING_POLICY_SLUG /
#              SIGNPATH_ORGANIZATION_ID / SIGNPATH_ARTIFACT_CONFIG_SLUG
#   Secret:    SIGNPATH_API_TOKEN
# 未配置时自动跳过签名，只产出未签名包。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则取 app/package.json；打 tag 时以 tag 为准）'
        required: false
        default: ''
      publish:
        description: '发布类型（none=只构建 artifact）'
        type: choice
        options:
          - none
          - prerelease
          - latest
        default: none
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

env:
  ELECTRON_VERSION: '45.0.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version and release mode
        id: meta
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'.Trim()
          $mode = '${{ github.event.inputs.publish }}'
          if (-not $mode) { $mode = 'none' }
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
            $version = $tagVersion
            if ($tagVersion -match '-') { $mode = 'prerelease' } else { $mode = 'latest' }
          }
          if (-not $version) {
            $package = Get-Content app/package.json -Raw | ConvertFrom-Json
            $version = [string]$package.version
          }
          $createRelease = ($mode -ne 'none')
          $isPrerelease = ($mode -eq 'prerelease')
          "version=$version" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "create_release=$($createRelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version mode=$mode create_release=$createRelease prerelease=$isPrerelease"

      - name: Release gate (pre)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/check-release.ps1 -Stage pre -Version '${{ steps.meta.outputs.version }}'

      - name: Download Electron runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/electron-dist | Out-Null
          node tools/download-electron.mjs $env:ELECTRON_VERSION tools/electron.zip
          tar.exe -xf tools/electron.zip -C tools/electron-dist

      - name: Build portable package (unsigned)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build-portable.ps1 -Version '${{ steps.meta.outputs.version }}'

      # ---- 可选：SignPath 开源签名（给启动器 WeNotice.exe 签名） -----------------
      - name: Upload launcher for signing
        id: upload-unsigned
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: wenotice-launcher-unsigned
          path: dist/WeNotice/WeNotice.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath
        id: signpath
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace launcher with signed copy
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Recurse -File signed -Filter 'WeNotice.exe' | Select-Object -First 1
          if (-not $signed) { throw '签名产物里找不到 WeNotice.exe' }
          Copy-Item $signed.FullName dist/WeNotice/WeNotice.exe -Force
          Get-AuthenticodeSignature dist/WeNotice/WeNotice.exe | Format-List Status,StatusMessage

      # ---- 打包 ------------------------------------------------------------------
      - name: Package portable zip
        id: pack
        shell: pwsh
        run: |
          $v = '${{ steps.meta.outputs.version }}'
          $zip = "dist/WeNotice-portable-$v.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          tar.exe -a -c -f $zip -C dist WeNotice
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  WeNotice-portable-$v.zip" | Out-File "dist/WeNotice-portable-$v.zip.sha256" -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "sha256=$hash"

      - name: Release gate (post)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/check-release.ps1 -Stage post -Version '${{ steps.meta.outputs.version }}'

      - name: Upload portable zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeNotice-portable-${{ steps.meta.outputs.version }}
          path: |
            dist/WeNotice-portable-${{ steps.meta.outputs.version }}.zip
            dist/WeNotice-portable-${{ steps.meta.outputs.version }}.zip.sha256

      - name: Create / update GitHub Release
        if: steps.meta.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WeNotice-portable-${{ steps.meta.outputs.version }}.zip
            dist/WeNotice-portable-${{ steps.meta.outputs.version }}.zip.sha256
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
